<!-- pages/logistics/transportation.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transportation Strategy | EchoGlaze</title>

  <!-- Global & Token CSS -->
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">

  <!-- HTMX Library -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://unpkg.com/htmx.org/dist/ext/select-response.js"></script>
</head>
<body class="bg-dark text-light font-sans antialiased" hx-ext="select-response">

  <!-- Navigation Bar -->
  <nav class="sticky top-0 z-10 bg-surface/80 backdrop-blur-md border-b border-border p-4">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <span class="text-xl">🚗</span>
        <select 
          id="transport-country-select" 
          class="bg-surface font-bold text-primary outline-none cursor-pointer text-sm p-2 rounded-xl border border-border"
          hx-get="../partials/countries/argentina.html"
          hx-select="#transportation-section"
          hx-target="#transport-data-target"
          hx-swap="innerHTML"
          onchange="this.setAttribute('hx-get', '../partials/countries/' + this.value + '.html'); htmx.process(this); htmx.trigger(this, 'change-country');"
          hx-trigger="change-country">
          <option value="argentina" selected>🇦🇷 Argentina</option>
          <option value="azerbaijan">🇦🇿 Azerbaijan</option>
        </select>
      </div>

      <a href="index.html" class="text-xs font-black uppercase text-muted hover:text-light transition-colors">
        ← Back to Logistics
      </a>
    </div>
  </nav>

  <!-- Main Target Container -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <div 
      id="transport-data-target" 
      hx-get="../partials/countries/argentina.html" 
      hx-select="#transportation-section" 
      hx-trigger="load">
      <!-- Section loaded dynamically from partial -->
    </div>
  </main>

</body>
</html>
