<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Transportation | EchoGlaze</title>

  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/animations.css">

  <script src="https://unpkg.com/htmx.org@1.9.10/dist/htmx.min.js"></script>
</head>

<body>

<div id="transportation-page-container" class="space-y-6 animate-fadeIn">

  <header class="flex items-center justify-between bg-surface p-4 rounded-xl border border-border shadow-sm mb-6">
    <div>
      <h4 class="text-xs font-extrabold uppercase tracking-wider text-light">
        Transit Context Scope
      </h4>
      <p class="text-[11px] text-muted">
        Toggle destination context for custom logistics networks
      </p>
    </div>

    <select
      hx-get="/partials/transportation/render"
      hx-target="#transportation-data-mount"
      hx-trigger="change, load"
      hx-include="this"
      name="country"
      class="px-3 py-1.5 bg-dark rounded-xl text-xs font-bold text-light border border-border outline-none cursor-pointer hover:text-indigo-400 transition-colors"
    >
      {{COUNTRY_OPTIONS}}
    </select>
  </header>

  <div class="max-w-6xl mx-auto px-4 py-4">
    <div class="mb-8">
      <h1 class="text-3xl font-extrabold text-light tracking-tight mb-2">
        🚗 Transportation
      </h1>
      <p class="text-xs text-muted">
        How locals move — cheapest by day, safest by night.
      </p>
    </div>

    <div id="transportation-data-mount" class="space-y-6">
    </div>

  </div>
</div>

</body>
</html>
