<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Logistics & Infrastructure | EchoGlaze</title>
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen">

  <nav class="sticky top-0 z-20 bg-white border-b border-slate-200 p-4 shadow-sm">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
      
      <!-- Mode Switcher -->
      <div class="flex items-center p-1.5 bg-slate-200/50 backdrop-blur-md rounded-[1.5rem] border border-slate-300/30">
        <button 
          hx-get="/api/logistics/compare-all" 
          hx-target="#logistics-content"
          class="flex-1 min-w-[140px] px-5 py-3 rounded-xl text-xs font-black tracking-widest bg-white text-indigo-600 shadow-md transition-all">
          COMPARE ALL
        </button>
        <button 
          hx-get="/api/logistics/country?country=argentina" 
          hx-target="#logistics-content"
          class="flex-1 min-w-[140px] px-5 py-3 rounded-xl text-xs font-black tracking-widest text-slate-500 hover:text-slate-700 transition-all">
          COUNTRY VIEW
        </button>
      </div>

      <!-- Transportation Shortcut -->
      <a href="/transportation" class="group relative flex-1 flex items-center justify-between p-1 bg-white border border-slate-200 rounded-[1.5rem] shadow-sm hover:shadow-xl transition-all overflow-hidden">
        <div class="flex items-center gap-4 p-3">
          <div class="w-12 h-12 rounded-xl bg-slate-50 flex items-center justify-center text-2xl group-hover:bg-indigo-50 transition-colors">🚗</div>
          <div>
            <h3 class="font-black text-slate-900 text-sm tracking-tight leading-none">Transportation</h3>
            <p class="text-[10px] text-slate-500 font-medium mt-1">Strategy & Apps</p>
          </div>
        </div>
      </a>

    </div>
  </nav>

  <!-- Main Content Container Loaded on Page Init -->
  <main id="logistics-content" class="max-w-6xl mx-auto p-6" hx-get="/api/logistics/compare-all" hx-trigger="load">
    <!-- Initial comparison view populated by server -->
  </main>

</body>
</html>
