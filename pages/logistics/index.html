<!-- pages/logistics/index.html -->
<nav class="sticky top-0 z-20 bg-white border-b border-slate-200 p-4 shadow-sm">
  <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
    <div class="flex flex-col md:flex-row items-stretch gap-4 w-full max-w-6xl">
      
      <!-- View Toggle -->
      <div class="flex items-center p-1.5 bg-slate-200/50 backdrop-blur-md rounded-[1.5rem] border border-slate-300/30">
        <button 
          hx-get="/components/logistics/compare-all.html"
          hx-target="#logistics-main"
          class="flex-1 min-w-[140px] px-5 py-3 rounded-xl text-xs font-black tracking-widest bg-white text-indigo-600 shadow-md"
        >
          COMPARE ALL
        </button>
        <button 
          hx-get="/partials/countries/argentina.html"
          hx-target="#logistics-main"
          class="flex-1 min-w-[140px] px-5 py-3 rounded-xl text-xs font-black tracking-widest text-slate-500 hover:text-slate-700"
        >
          COUNTRY VIEW
        </button>
      </div>

      <!-- Transportation Button -->
      <a href="/pages/logistics/transportation.html" 
         class="group relative flex-1 flex items-center justify-between p-1 bg-white border border-slate-200 rounded-[1.5rem] shadow-sm hover:shadow-xl transition-all"
      >
        <div class="flex items-center gap-4 p-3">
          <div class="w-12 h-12 rounded-xl bg-slate-50 flex items-center justify-center text-2xl group-hover:bg-indigo-50">
            <span>🚗</span>
          </div>
          <div>
            <h3 class="font-black text-slate-900 text-sm">Transportation</h3>
            <p class="text-[10px] text-slate-500 font-medium">Strategy & Apps</p>
          </div>
        </div>
      </a>

    </div>
  </div>
</nav>

<main class="max-w-6xl mx-auto p-6 space-y-6">

  <!-- Country Selection Header (Shared across all country views) -->
  <header class="flex items-center gap-2">
    <select
      id="country-selector"
      hx-target="#logistics-main"
      hx-on:change="htmx.ajax('GET', `/partials/countries/${this.value}.html`, '#logistics-main')"
      class="bg-transparent font-black text-slate-900 text-xl outline-none cursor-pointer hover:text-indigo-600 transition-colors"
    >
      <option value="argentina" selected>🇦🇷 Argentina</option>
      <option value="azerbaijan">🇦🇿 Azerbaijan</option>
    </select>
  </header>

  <!-- Container swapped by HTMX -->
  <div id="logistics-main">
    <div hx-get="/partials/countries/argentina.html" hx-trigger="load" hx-target="#logistics-main"></div>
  </div>

</main>
