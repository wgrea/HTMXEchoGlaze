<!-- pages/accommodation/index.html -->
<main class="max-w-[1440px] mx-auto px-4 py-6">
  
  <div class="mb-6 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-xl font-black text-slate-800">🏠 Accommodation & Food Strategy Finder</h1>
      <p class="text-xs text-slate-500 mt-1">Explore verified stay options and local food breakdowns</p>
    </div>

    <!-- Declarative Unified Location Control Group -->
    <form class="flex items-center gap-3" id="accommodation-location-form" onsubmit="return false;">
      <!-- Country Dropdown: Populates city choices AND forces content updates safely -->
      <select id="acc-country-select" 
              name="country" 
              class="px-3 py-1.5 bg-slate-100 rounded-xl text-xs font-bold text-slate-800 border-none outline-none cursor-pointer"
              hx-get="/partials/global/country-options"
              hx-trigger="load"
              hx-target="this"
              hx-swap="innerHTML"
              hx-on:change="
                htmx.ajax('GET', '/partials/accommodation/city-dropdown-options', {
                  target: '#acc-city-select', 
                  values: { country: this.value }
                }).then(() => {
                  htmx.trigger('#accommodation-content', 'load-data');
                });
              ">
        <option value="argentina">Loading Registry...</option>
      </select>

      <!-- City Selector: Explicitly handles parent reloads with full index dependencies -->
      <select id="acc-city-select" 
              name="city"
              class="px-3 py-1.5 bg-slate-100 rounded-xl text-xs font-bold text-slate-800 border-none outline-none cursor-pointer"
              hx-get="/partials/accommodation/city-dropdown-options"
              hx-trigger="load from:#acc-country-select"
              hx-target="this" 
              hx-include="[id='acc-country-select']"
              hx-swap="innerHTML"
              hx-on:change="htmx.trigger('#accommodation-content', 'load-data')">
        <option value="">Select a city</option>
      </select>
    </form>
  </div>

  <!-- Mode Toggle Component Framework (Mirrors Resonance Level Toggle Styles) -->
  <div class="flex gap-2 mb-6" id="mode-toggle-form">
    <input type="hidden" id="acc-mode-input" name="mode" value="stay">
    
    <button type="button" 
            id="btn-mode-stay" 
            class="px-3 py-1 rounded-lg text-sm font-bold bg-indigo-600 text-white" 
            hx-on:click="
              document.getElementById('acc-mode-input').value = 'stay';
              this.className = 'px-3 py-1 rounded-lg text-sm font-bold bg-indigo-600 text-white';
              document.getElementById('btn-mode-food').className = 'px-3 py-1 rounded-lg text-sm font-bold bg-slate-100 text-slate-600';
              htmx.trigger('#accommodation-content', 'load-data');
            ">
      Where to Stay
    </button>
    
    <button type="button" 
            id="btn-mode-food" 
            class="px-3 py-1 rounded-lg text-sm font-bold bg-slate-100 text-slate-600"
            hx-on:click="
              document.getElementById('acc-mode-input').value = 'food';
              this.className = 'px-3 py-1 rounded-lg text-sm font-bold bg-indigo-600 text-white';
              document.getElementById('btn-mode-stay').className = 'px-3 py-1 rounded-lg text-sm font-bold bg-slate-100 text-slate-600';
              htmx.trigger('#accommodation-content', 'load-data');
            ">
      Food Strategy
    </button>
  </div>

  <!-- Central Processing Mount Target Area -->
  <div id="accommodation-content" 
       hx-get="/partials/accommodation/render"
       hx-trigger="load, load-data"
       hx-include="#accommodation-location-form, [id='acc-mode-input']"
       hx-swap="innerHTML">
    <p class="text-xs text-slate-400 italic">Select location parameters to mount template logs...</p>
  </div>
</main>
