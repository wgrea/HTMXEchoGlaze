<!-- pages/accommodation/index.html -->
<main class="max-w-[1440px] mx-auto px-4 py-6">
  
  <div class="mb-6 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-xl font-black text-slate-800">🏠 Accommodation & Food Strategy Finder</h1>
      <p class="text-xs text-slate-500 mt-1">Explore verified stay options and local food breakdowns</p>
    </div>

    <!-- Declarative Unified Location Control Group -->
    <form class="flex items-center gap-3" id="accommodation-location-form" onsubmit="return false;">
      
      <!-- Country Dropdown: Populates city dropdown box options list AND immediately clears out stale panels with interstitial layout -->
      <select id="acc-country-select" 
              name="country" 
              class="px-3 py-1.5 bg-slate-100 rounded-xl text-xs font-bold text-slate-800 border-none outline-none cursor-pointer"
              hx-get="/partials/global/country-options"
              hx-trigger="load"
              hx-target="this"
              hx-swap="innerHTML"
              hx-on:change="
                document.getElementById('accommodation-content').innerHTML = '<div class=\'p-6 bg-slate-50 border border-dashed border-slate-200 rounded-xl text-center\'><p class=\'text-xs text-slate-400 italic flex items-center justify-center gap-2\'><span>🔄</span> Syncing data pipelines for ' + this.options[this.selectedIndex].text + '...</p></div>';
                htmx.trigger('#acc-city-select', 'fetch-cities');
              ">
        <option value="argentina">Loading Registry...</option>
      </select>

      <!-- City Selector: Explicitly gates downstream panel data painting until after DOM renders choices -->
      <select id="acc-city-select" 
              name="city"
              class="px-3 py-1.5 bg-slate-100 rounded-xl text-xs font-bold text-slate-800 border-none outline-none cursor-pointer"
              hx-get="/partials/accommodation/city-dropdown-options"
              hx-trigger="load from:#acc-country-select delay:50ms, fetch-cities"
              hx-target="this" 
              hx-include="#acc-country-select"
              hx-swap="innerHTML"
              hx-on::after-on-load="htmx.trigger('#accommodation-content', 'load-data')"
              hx-on:change="htmx.trigger('#accommodation-content', 'load-data')">
        <option value="">Select a city</option>
      </select>
    </form>
  </div>

  <!-- Mode Toggles -->
  <div class="flex gap-2 mb-6" id="mode-toggle-form">
    <input type="hidden" id="acc-mode-input" name="mode" value="stay">
    <button type="button" id="btn-mode-stay" class="px-3 py-1 rounded-lg text-sm font-bold bg-indigo-600 text-white" hx-on:click="document.getElementById('acc-mode-input').value = 'stay'; this.className = 'px-3 py-1 rounded-lg text-sm font-bold bg-indigo-600 text-white'; document.getElementById('btn-mode-food').className = 'px-3 py-1 rounded-lg text-sm font-bold bg-slate-100 text-slate-600'; htmx.trigger('#accommodation-content', 'load-data');">Where to Stay</button>
    <button type="button" id="btn-mode-food" class="px-3 py-1 rounded-lg text-sm font-bold bg-slate-100 text-slate-600" hx-on:click="document.getElementById('acc-mode-input').value = 'food'; this.className = 'px-3 py-1 rounded-lg text-sm font-bold bg-indigo-600 text-white'; document.getElementById('btn-mode-stay').className = 'px-3 py-1 rounded-lg text-sm font-bold bg-slate-100 text-slate-600'; htmx.trigger('#accommodation-content', 'load-data');">Food Strategy</button>
  </div>

  <!-- Central Processing Mount Target Area -->
  <div id="accommodation-content" 
       hx-get="/partials/accommodation/render"
       hx-trigger="load delay:250ms, load-data"
       hx-include="#accommodation-location-form, [id='acc-mode-input']"
       hx-swap="innerHTML">
    <div class="p-6 bg-slate-50 border border-dashed border-slate-200 rounded-xl text-center">
      <p class="text-xs text-slate-400 italic">Assembling regional information arrays...</p>
    </div>
  </div>
</main>
