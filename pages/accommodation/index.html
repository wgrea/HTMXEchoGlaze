<!-- pages/accommodation/index.html -->
<script src="/pages/accommodation/index.js" defer></script>

<main class="max-w-[1440px] mx-auto px-4 py-6">
  
  <div class="mb-6 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-xl font-black text-slate-800">🏠 Accommodation & Food Strategy Finder</h1>
      <p class="text-xs text-slate-500 mt-1">Explore verified stay options and local food breakdowns</p>
    </div>

    <!-- Global Location Selector -->
    <div class="flex items-center gap-3">
      <select id="acc-country-select" class="px-3 py-1.5 bg-slate-100 rounded-xl text-xs font-bold text-slate-800 border-none outline-none cursor-pointer" onchange="filterAccommodationCities(this)">
        <option value="argentina" selected>🇦🇷 Argentina</option>
        <option value="azerbaijan">🇦🇿 Azerbaijan</option>
      </select>

      <select id="acc-city-select" 
              class="px-3 py-1.5 bg-slate-100 rounded-xl text-xs font-bold text-slate-800 border-none outline-none cursor-pointer"
              hx-get="/partials/cities/buenos-aires.html" 
              hx-target="#accommodation-content" 
              hx-select="#stay-options-section, #food-strategy-section"
              hx-swap="innerHTML"
              onchange="fetchAccommodationCity(this)">
        <option value="buenos-aires" data-country="argentina" selected>Buenos Aires (BUE)</option>
        <option value="baku" data-country="azerbaijan" class="hidden">Baku (BAK)</option>
      </select>
    </div>
  </div>

  <!-- Mode Toggle (Stay vs Food Strategy) -->
  <div class="flex gap-2 mb-6">
    <button type="button" id="btn-mode-stay" class="px-3 py-1 rounded-lg text-sm font-bold bg-indigo-600 text-white" onclick="switchAccMode('stay')">Where to Stay</button>
    <button type="button" id="btn-mode-food" class="px-3 py-1 rounded-lg text-sm font-bold bg-slate-100 text-slate-600" onclick="switchAccMode('food')">Food Strategy</button>
  </div>

  <!-- Content Container (Loads city accommodation/food partials) -->
  <div id="accommodation-content" 
       hx-get="/partials/cities/buenos-aires.html" 
       hx-select="#stay-options-section, #food-strategy-section"
       hx-trigger="load" 
       hx-swap="innerHTML">
    <!-- Partial stay/food sections load here -->
  </div>
</main>
