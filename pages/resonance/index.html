<!-- pages/resonance.html -->
<script src="/pages/resonance/index.js" defer></script>
<main class="max-w-[1440px] mx-auto px-4 py-6">
  <div class="mb-6 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-4">
    <div>
      <h1 class="text-xl font-black text-slate-800 flex items-center gap-2">
        <span>🌅</span> Resonance Signals
      </h1>
      <p class="text-xs text-slate-500 mt-1">Discover the unique characteristics and energy patterns of destinations</p>
    </div>

    <!-- Controls Bar -->
    <div class="flex items-center gap-3">
      <!-- Level Toggle -->
      <div class="inline-flex rounded-lg border border-slate-200 bg-slate-100 p-1">
        <button type="button" id="toggle-country" class="px-3 py-1 rounded-md text-xs font-bold bg-white text-slate-800 shadow-sm" onclick="switchResonanceLevel('country')">Country</button>
        <button type="button" id="toggle-city" class="px-3 py-1 rounded-md text-xs font-bold text-slate-600" onclick="switchResonanceLevel('city')">City</button>
      </div>

      <!-- Country Select -->
      <select id="resonance-country-select" 
              class="px-3 py-1.5 bg-slate-100 rounded-xl text-xs font-bold text-slate-800 border-none outline-none cursor-pointer"
              onchange="updateResonanceTarget()">
        <option value="argentina" selected>🇦🇷 Argentina</option>
        <option value="azerbaijan">🇦🇿 Azerbaijan</option>
      </select>

      <!-- City Select (Hidden by default until City Level is toggled) -->
      <select id="resonance-city-select" 
              class="px-3 py-1.5 bg-slate-100 rounded-xl text-xs font-bold text-slate-800 border-none outline-none cursor-pointer d-none"
              onchange="updateResonanceTarget()">
        <option value="buenos-aires" data-country="argentina" selected>Buenos Aires (BUE)</option>
        <option value="baku" data-country="azerbaijan">Baku (BAK)</option>
      </select>
    </div>
  </div>

  <!-- Dynamic Content Area -->
<div id="resonance-content"
     hx-get="/partials/countries/argentina.html"
     hx-select="#resonance-section"
     hx-trigger="load"
     hx-swap="innerHTML">
  </div>
</main>
