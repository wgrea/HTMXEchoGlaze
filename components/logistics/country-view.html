<!-- components/logistics/country-view.html -->
<div class="space-y-8 animate-in fade-in duration-300">
  <header>
    <div class="flex items-center gap-2">
      <span class="text-2xl">{{COUNTRY_ICON}}</span>
<select
  hx-get="/api/logistics/country"
  hx-target="#logistics-content"
  hx-include="this"
  name="country"
  class="..."
>
  {{COUNTRY_OPTIONS}}
</select>
    </div>
    <p class="text-slate-500 text-sm italic mt-1">Region: {{REGION}}</p>
  </header>

  <div class="space-y-6">
    <!-- Work Policy Section -->
    <section class="rounded-2xl border border-slate-100 bg-white p-6 shadow-sm">
       <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 text-sm">
        <div class="space-y-1">
          <p class="text-[11px] font-black uppercase tracking-[0.16em] text-slate-400">Work Policy</p>
          <p class="text-slate-700 leading-snug font-medium">{{WORK_POLICY}}</p>
        </div>
        <div class="space-y-1">
          <p class="text-[11px] font-black uppercase tracking-[0.16em] text-slate-400">Registration</p>
          <p class="text-slate-700 font-medium">{{REGISTRATION}}</p>
        </div>
      </div>
    </section>
  </div>
</div>
