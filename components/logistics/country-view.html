<!-- components/logistics/country-view.html -->
<div class="space-y-6 animate-in fade-in duration-300">
  <header class="flex items-center gap-2">
    <span class="text-2xl">{{COUNTRY_ICON}}</span>
    <div>
      <select
        hx-get="/api/logistics/country"
        hx-target="#logistics-content"
        hx-include="this"
        name="country"
        class="bg-transparent font-black text-slate-900 text-xl outline-none cursor-pointer hover:text-indigo-600 transition-colors"
      >
        {{COUNTRY_OPTIONS}}
      </select>
      <p class="text-xs text-slate-500 font-mono uppercase tracking-wider">Region: {{REGION}}</p>
    </div>
  </header>

  <!-- Seasonality Breakdown -->
  <section class="rounded-2xl border border-slate-100 bg-white p-6 shadow-sm space-y-3">
    <h3 class="text-xs font-black uppercase tracking-[0.18em] text-slate-400">Seasonality Breakdown</h3>
    <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-12 gap-2 text-center text-xs font-semibold">
      {{SEASONALITY_STRIP}}
    </div>
  </section>

  <!-- Legal & Work Policy Grid -->
  <section class="rounded-2xl border border-slate-100 bg-white p-6 shadow-sm">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 text-sm">
      <div class="space-y-1">
        <p class="text-[11px] font-black uppercase tracking-[0.16em] text-slate-400">Work Policy</p>
        <p class="text-slate-700 leading-snug font-medium">{{WORK_POLICY}}</p>
      </div>
      <div class="space-y-1">
        <p class="text-[11px] font-black uppercase tracking-[0.16em] text-slate-400">Registration Protocol</p>
        <p class="text-slate-700 font-medium">{{REGISTRATION}}</p>
      </div>
    </div>
  </section>
</div>
